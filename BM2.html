<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shape from Motion - Biological Motion</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Segoe UI', Arial, sans-serif;
            background-color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-y: auto;
            margin: 0;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        #quiz-container {
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            background-color: #fff;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.1);
            width: 450px;
            max-width: 630px;
            position: relative;
            z-index: 1;
            animation: container-appear 0.8s ease-out;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            animation: pulse 2s infinite;
        }

        .profile-icon {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: linear-gradient(135deg, #48C9B0 0%, #1ABC9C 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 16px;
            box-shadow: 0 0 15px rgba(26, 188, 156, 0.4);
        }
        
        .profile-icon:hover {
            transform: rotate(5deg) scale(1.1);
            box-shadow: 0 0 25px rgba(26, 188, 156, 0.6);
        }

        h1 { color: #2c3e50; margin: 0; font-size: 1.5em; }
        h2 { color: #2c3e50; margin: 0; }

        button {
            padding: 8px 12px;
            margin: 5px 3px;
            border: none;
            background: linear-gradient(135deg, #9966CC 0%, #8A2BE2 100%);
            color: white;
            font-size: 15px;
            cursor: pointer;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            z-index: 1;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(153, 102, 204, 0.3);
            animation: buttonAppear 0.6s ease-out;
        }

        button:hover {
            background: linear-gradient(135deg, #A569BD 0%, #9B59B6 100%);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(153, 102, 204, 0.4);
        }

        #images-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .option-btn {
            width: 120px;
            height: 120px;
            border: 3px solid transparent;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        .option-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            border-color: #9966CC;
        }

        #result-container { display: none; margin-top: 20px; }
        #report-container { margin-top: 30px; width: 100%; max-width: 600px; }

        .feedback-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease-in-out;
        }
        
        .feedback-message {
            padding: 30px 40px;
            border-radius: 15px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: bounceIn 0.5s ease-out;
            min-width: 300px;
        }
        
        .feedback-success { background: linear-gradient(135deg, #4CAF50, #45a049); color: white; border: 3px solid #2E7D32; }
        .feedback-error { background: linear-gradient(135deg, #f44336, #d32f2f); color: white; border: 3px solid #C62828; }

        @keyframes container-appear { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0%, 100% { box-shadow: 0 2px 8px rgba(0,0,0,0.1); } 50% { box-shadow: 0 4px 16px rgba(0,0,0,0.15); } }
        @keyframes buttonAppear { from { opacity: 0; transform: translateY(10px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes bounceIn { 0% { transform: scale(0.3); opacity: 0; } 50% { transform: scale(1.05); } 70% { transform: scale(0.9); } 100% { transform: scale(1); opacity: 1; } }

        .user-info { position: absolute; top: 20px; right: 20px; text-align: right; font-size: 14px; color: #666; }
        .patient-indicator { display: inline-block; background-color: #e9f5e9; color: #4CAF50; padding: 3px 8px; border-radius: 12px; font-size: 12px; margin-left: 8px; }
        .instruction { font-size: 18px; color: #666; margin-bottom: 20px; }
        .motion-container { height: 150px; display: flex; align-items: center; justify-content: center; background: #f5f5f5; border-radius: 10px; margin: 20px 0; }
    </style>
</head>
<body>
    <div id="quiz-container">
        <div class="header">
            <h1>Shape from Motion</h1>
            <div class="profile-icon" id="profileIcon" title="Back to Home" onclick="window.location.href='index.html'"></div>
            <div class="user-info">
                <span id="patient-indicator" class="patient-indicator"></span>
            </div>
        </div>
        <p class="instruction">Watch the moving dots. What shape do they make?</p>
        <div id="question-container">
            <div class="motion-container" id="motion-container"></div>
        </div>
        <div id="images-container"></div>
        <div id="result-container">
            <h2>Quiz Results</h2>
            <ul style="list-style: none; padding: 0;">
                <li><strong>Score:</strong> <span id="score"></span></li>
                <li><strong>Total Time:</strong> <span id="total-time"></span> seconds</li>
                <li><strong>Average Time:</strong> <span id="avg-time"></span> seconds</li>
                <li><strong>First Tap Time:</strong> <span id="first-tap"></span> seconds</li>
                <li><strong>Total Taps:</strong> <span id="total-taps"></span></li>
                <li><strong>Correct Answers:</strong> <span id="total-correct"></span></li>
                <li><strong>Incorrect Answers:</strong> <span id="total-incorrect"></span></li>
            </ul>
            <a href="BM.html" style="text-decoration: none;"><button>Return</button></a>
        </div>
    </div>

    <div id="report-container">
        <h2>All Quiz Attempts</h2>
        <ul id="report-list" style="list-style: none; padding: 0;"></ul>
        <button id="clear-report" onclick="clearReport()">Clear Report</button>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <script>
        // Initialize Firebase
        if (typeof firebase !== 'undefined' && !firebase.apps.length) {
            firebase.initializeApp({
                apiKey: "AIzaSyDFENL5Z_2Cewh4p6zp_BZtxL9n0di-9u8",
                authDomain: "projeccvi.firebaseapp.com",
                projectId: "projeccvi",
                storageBucket: "projeccvi.appspot.com",
                messagingSenderId: "279067566247",
                appId: "1:279067566247:web:9cf00f7bf1ea3549fabb82"
            });
        }
        
        const auth = firebase.auth();
        const database = firebase.database();
        
        const currentPatientId = sessionStorage.getItem('currentPatientId');
        const doctorId = sessionStorage.getItem('doctorId');
        const isPatientQuiz = !!currentPatientId;
        
        // Shape recognition questions
        const questions = [
            { shape: 'circle', emoji: '⭕', name: 'Circle' },
            { shape: 'square', emoji: '⬜', name: 'Square' },
            { shape: 'triangle', emoji: '🔺', name: 'Triangle' },
            { shape: 'star', emoji: '⭐', name: 'Star' },
            { shape: 'circle', emoji: '⭕', name: 'Circle' },
            { shape: 'square', emoji: '⬜', name: 'Square' },
            { shape: 'triangle', emoji: '🔺', name: 'Triangle' },
            { shape: 'star', emoji: '⭐', name: 'Star' }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let incorrectAnswers = 0;
        let timeTaken = [];
        let startTime;
        let totalStartTime;
        let totalTaps = 0;
        let firstTapTime;

        // Auth observer
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    if (!isPatientQuiz) {
                        const roleSnapshot = await database.ref(`roles/${user.uid}`).once('value');
                        if (roleSnapshot.val() === 'doctor') {
                            alert('Please select a patient first to administer the quiz.');
                            window.location.href = 'index.html';
                            return;
                        }
                    }
                    
                    let profile;
                    if (isPatientQuiz) {
                        const patientSnapshot = await database.ref(`doctors/${doctorId}/patients/${currentPatientId}/profile`).once('value');
                        profile = patientSnapshot.val();
                    } else {
                        const userSnapshot = await database.ref(`users/${user.uid}/profile`).once('value');
                        profile = userSnapshot.val();
                    }
                    
                    let initial = 'U';
                    if (profile && profile.name) initial = profile.name.charAt(0).toUpperCase();
                    else if (user.email) initial = user.email.charAt(0).toUpperCase();
                    
                    document.getElementById('patient-indicator').style.display = isPatientQuiz ? 'inline-block' : 'none';
                    document.getElementById('profileIcon').textContent = initial;
                    
                    totalStartTime = Date.now();
                    displayQuestion();
                } catch (error) {
                    document.getElementById('profileIcon').textContent = 'U';
                    totalStartTime = Date.now();
                    displayQuestion();
                }
            } else {
                window.location.href = 'login.html';
            }
        });

        document.addEventListener("click", () => {
            totalTaps++;
            if (totalTaps === 1) firstTapTime = (Date.now() - totalStartTime) / 1000;
        });

        function displayQuestion() {
            const question = questions[currentQuestionIndex];
            startTime = Date.now();
            
            // Show motion simulation
            const motionContainer = document.getElementById('motion-container');
            motionContainer.innerHTML = `
                <div style="position: relative; width: 100px; height: 100px;">
                    <div style="position: absolute; width: 8px; height: 8px; background: #9966CC; border-radius: 50%; animation: ${question.shape}Motion 2s infinite;"></div>
                    <div style="position: absolute; width: 8px; height: 8px; background: #48C9B0; border-radius: 50%; animation: ${question.shape}Motion 2s infinite 0.5s;"></div>
                    <div style="position: absolute; width: 8px; height: 8px; background: #FF6B6B; border-radius: 50%; animation: ${question.shape}Motion 2s infinite 1s;"></div>
                    <div style="position: absolute; width: 8px; height: 8px; background: #FFD93D; border-radius: 50%; animation: ${question.shape}Motion 2s infinite 1.5s;"></div>
                </div>
            `;
            
            // Add motion animations
            if (!document.getElementById('bm-motion-styles')) {
                const style = document.createElement('style');
                style.id = 'bm-motion-styles';
                style.textContent = `
                    @keyframes circleMotion { 0% { transform: rotate(0deg) translateX(35px) rotate(0deg); } 100% { transform: rotate(360deg) translateX(35px) rotate(-360deg); } }
                    @keyframes squareMotion { 0% { transform: translate(35px, 35px); } 25% { transform: translate(-35px, 35px); } 50% { transform: translate(-35px, -35px); } 75% { transform: translate(35px, -35px); } 100% { transform: translate(35px, 35px); } }
                    @keyframes triangleMotion { 0% { transform: translate(0, -30px); } 33% { transform: translate(26px, 15px); } 66% { transform: translate(-26px, 15px); } 100% { transform: translate(0, -30px); } }
                    @keyframes starMotion { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.2); } 100% { transform: rotate(360deg) scale(1); } }
                `;
                document.head.appendChild(style);
            }
            
            // Show options
            const options = [
                { emoji: '⭕', name: 'Circle', correct: question.shape === 'circle' },
                { emoji: '⬜', name: 'Square', correct: question.shape === 'square' },
                { emoji: '🔺', name: 'Triangle', correct: question.shape === 'triangle' },
                { emoji: '⭐', name: 'Star', correct: question.shape === 'star' }
            ].sort(() => Math.random() - 0.5);
            
            const container = document.getElementById('images-container');
            container.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `${opt.emoji}<br><span style="font-size: 14px;">${opt.name}</span>`;
                btn.onclick = () => checkAnswer(opt.correct);
                container.appendChild(btn);
            });
        }

        function checkAnswer(correct) {
            const endTime = Date.now();
            timeTaken.push((endTime - startTime) / 1000);
            
            if (correct) {
                score++;
                showFeedback('✓ Correct!', 'success');
            } else {
                incorrectAnswers++;
                showFeedback('✗ Try Again', 'error');
            }
            
            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < questions.length) {
                    displayQuestion();
                } else {
                    showResults();
                }
            }, 1500);
        }

        function showFeedback(message, type) {
            const existing = document.querySelector('.feedback-overlay');
            if (existing) existing.remove();
            
            const overlay = document.createElement('div');
            overlay.className = 'feedback-overlay';
            const msg = document.createElement('div');
            msg.className = `feedback-message feedback-${type}`;
            msg.textContent = message;
            overlay.appendChild(msg);
            document.body.appendChild(overlay);
            
            setTimeout(() => overlay.remove(), 1200);
        }

        function showResults() {
            document.getElementById('question-container').style.display = 'none';
            document.getElementById('images-container').style.display = 'none';
            document.getElementById('result-container').style.display = 'block';
            
            const totalTime = (Date.now() - totalStartTime) / 1000;
            const avgTime = timeTaken.reduce((a, b) => a + b, 0) / timeTaken.length;
            
            document.getElementById('score').textContent = `${score}/${questions.length}`;
            document.getElementById('total-time').textContent = totalTime.toFixed(2);
            document.getElementById('avg-time').textContent = avgTime.toFixed(2);
            document.getElementById('first-tap').textContent = firstTapTime ? firstTapTime.toFixed(2) : 'N/A';
            document.getElementById('total-taps').textContent = totalTaps;
            document.getElementById('total-correct').textContent = score;
            document.getElementById('total-incorrect').textContent = incorrectAnswers;
            
            saveQuizResults(score, totalTime.toFixed(2), avgTime.toFixed(2), firstTapTime, totalTaps, score, incorrectAnswers);
            fetchPreviousAttempts();
        }

        async function fetchPreviousAttempts() {
            try {
                const user = auth.currentUser;
                if (!user) return;
                
                let path;
                const reportList = document.getElementById('report-list');
                reportList.innerHTML = '<h3>Previous Attempts</h3>';
                
                if (currentPatientId && doctorId) {
                    path = `doctors/${doctorId}/patients/${currentPatientId}/quiz/BM2`;
                } else {
                    const roleSnapshot = await database.ref(`roles/${user.uid}`).once('value');
                    const role = roleSnapshot.val();
                    if (role === 'doctor') {
                        path = `doctors/${user.uid}/quiz/BM2`;
                    } else {
                        path = `users/${user.uid}/quiz/BM2`;
                    }
                }
                
                const resultsSnapshot = await database.ref(path).once('value');
                
                if (resultsSnapshot.exists()) {
                    const results = [];
                    resultsSnapshot.forEach(childSnapshot => {
                        results.push({ id: childSnapshot.key, ...childSnapshot.val() });
                    });
                    results.sort((a, b) => b.timestamp - a.timestamp);
                    const recentResults = results.slice(0, 5);
                    
                    if (recentResults.length > 0) {
                        recentResults.forEach(result => {
                            const timestamp = result.timestamp;
                            const date = typeof timestamp === 'number' ? new Date(timestamp) : new Date(timestamp);
                            const formattedDate = `${date.toLocaleDateString()} ${date.toLocaleTimeString()}`;
                            
                            const attemptItem = document.createElement('div');
                            attemptItem.className = 'attempt-item';
                            attemptItem.style.cssText = 'background: #f9f9f9; padding: 15px; margin: 10px 0; border-radius: 8px;';
                            attemptItem.innerHTML = `<strong>${formattedDate}</strong><br>Score: ${result.score}/${questions.length}, Time: ${result.totalTime || 'N/A'}s`;
                            reportList.appendChild(attemptItem);
                        });
                    } else {
                        reportList.innerHTML += '<p>No previous attempts found.</p>';
                    }
                } else {
                    reportList.innerHTML += '<p>No previous attempts found.</p>';
                }
            } catch (error) {
                console.error('Error fetching previous attempts:', error);
            }
        }

        async function saveQuizResults(score, totalTime, averageTime, firstTapTime, totalTaps, correctAnswers, incorrectAnswers) {
            const user = auth.currentUser;
            if (!user) return;

            try {
                const timestamp = Date.now();
                let path;

                if (currentPatientId && doctorId) {
                    path = `doctors/${doctorId}/patients/${currentPatientId}/quiz/BM2/${timestamp}`;
                } else {
                    const roleSnapshot = await database.ref(`roles/${user.uid}`).once('value');
                    const role = roleSnapshot.val();
                    if (role === 'doctor') {
                        path = `doctors/${user.uid}/quiz/BM2/${timestamp}`;
                    } else {
                        path = `users/${user.uid}/quiz/BM2/${timestamp}`;
                    }
                }

                await database.ref(path).set({
                    score, totalTime, averageTime, firstTapTime, totalTaps, correctAnswers, incorrectAnswers, timestamp
                });
            } catch (error) {
                console.error('Error saving quiz results:', error);
            }
        }

        async function clearReport() {
            const user = auth.currentUser;
            if (!user) {
                alert('You need to be logged in to clear the report.');
                return;
            }

            try {
                let path;
                if (currentPatientId && doctorId) {
                    path = `doctors/${doctorId}/patients/${currentPatientId}/quiz/BM2`;
                } else {
                    const roleSnapshot = await database.ref(`roles/${user.uid}`).once('value');
                    const role = roleSnapshot.val();
                    if (role === 'doctor') {
                        path = `doctors/${user.uid}/quiz/BM2`;
                    } else {
                        path = `users/${user.uid}/quiz/BM2`;
                    }
                }
                await database.ref(path).remove();
                document.getElementById('report-list').innerHTML = '<h3>Previous Attempts</h3><p>Reports cleared.</p>';
            } catch (error) {
                console.error('Error clearing reports:', error);
            }
        }
    </script>
</body>
</html>
